<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerMate AI</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <header>
        <h1>CareerMate AI</h1>
        <p>Your AI-powered placement preparation assistant</p>
    </header>

    <main>
        <section>
            <h2>Welcome to CareerMate AI</h2>
            <p>Prepare for your placements with confidence.</p>

            <label for="topic">Choose a topic:</label>

                <option>Problem Solving</option>

                <option>Communication Skills</option>

            <button onclick="alert('Your preparation journey starts now!')">

            </button>
        </section>
    </main>

</html>
